name: Build iOS IPA & AltStore Feed

on:
  push:
    branches:
      - feature/ios-port
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
      build_number:
        description: "Build number"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iPhone IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build shared iOS Frameworks
        run: |
          ./gradlew :shared:compileIosMainKotlinMetadata
          ./gradlew :sharedUi:compileIosMainKotlinMetadata

      - name: Compile Release Framework for iPhone
        run: |
          ./gradlew :sharedUi:linkReleaseFrameworkIosArm64

      - name: Verify Framework Output
        run: |
          ls -la sharedUi/build/bin/iosArm64/releaseFramework/

      - name: Upload iOS Framework Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChordPlaySharedUi-framework
          path: sharedUi/build/bin/iosArm64/releaseFramework/

