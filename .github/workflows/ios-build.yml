name: Build iOS IPA & AltStore Feed

on:
  push:
    branches:
      - feature/ios-port
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
      build_number:
        description: "Build number"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iPhone IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile Release Framework for iPhone
        run: |
          ./gradlew :sharedUi:linkReleaseFrameworkIosArm64 --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx8192m -XX:MaxMetaspaceSize=1g -XX:+UseG1GC" \
            -Pkotlin.native.jvmArgs="-Xmx8192m -XX:MaxMetaspaceSize=1g"

      - name: Verify Framework Output
        run: |
          ls -la sharedUi/build/bin/iosArm64/releaseFramework/

      - name: Upload iOS Framework Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChordPlaySharedUi-framework
          path: sharedUi/build/bin/iosArm64/releaseFramework/

      - name: Assemble iOS App Bundle & Package IPA
        continue-on-error: true
        run: |
          mkdir -p build/ios/ChordPlay.app
          cp iosApp/iosApp/Info.plist build/ios/ChordPlay.app/Info.plist

          echo "Compiling Swift entry point..."
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -F sharedUi/build/bin/iosArm64/releaseFramework \
            -framework ChordPlaySharedUi \
            iosApp/iosApp/iOSApp.swift iosApp/iosApp/ContentView.swift \
            -o build/ios/ChordPlay.app/ChordPlay
          chmod +x build/ios/ChordPlay.app/ChordPlay

          echo "Packaging unsigned IPA..."
          python3 tools/ios_package.py build/ios/ChordPlay.app build/ios/ChordPlay-unsigned.ipa
          ls -la build/ios/

      - name: Upload iOS IPA Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ChordPlay-iOS-IPA
          path: |
            build/ios/ChordPlay-unsigned.ipa
            build/ios/ChordPlay-unsigned.ipa.sha256
            build/ios/ChordPlay-unsigned.ipa.json
